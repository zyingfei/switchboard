# Minimal honest CI for the Sidetrack Bun monorepo.
# Runs on pushes to main and on every pull request. Branch pushes are
# covered by their PR run alone — an unfiltered `push:` trigger made every
# branch push run the suite TWICE (push + pull_request), doubling failure
# emails and CI minutes for zero extra signal.
#
# What is NOT here:
#   - e2e / Playwright (needs a live browser + companion vault) — see
#     issue #143 and docs/CI.md for why, and what the `companion` job's
#     src/integration/extensionCompanionSpine.test.ts test does instead
#   - eval suites (eval:recall — cost-gated, needs model downloads)
#   - a browser-driven build step (wxt build IS exercised, in
#     `package-smoke` below, but only as a real-artifact smoke check, not
#     to run anything through an actual browser)
#
# Layout note: this is a Bun workspace — ALL binaries (tsc, vitest, wxt) are
# hoisted to the repo-root node_modules/.bin. Steps that run from a package
# working-directory must use ../../node_modules/.bin/<tool>.
# Each job runs its own `bun install --frozen-lockfile` (fast, deterministic)
# instead of a cross-job cache dance — reliability over seconds saved.
#
# Job inventory (name / blocking? / why) — see docs/CI.md for the full
# blocking-vs-advisory contract and the `bun run verify` vs hosted-CI split:
#   companion         blocking  typecheck + full `bun test` (includes the
#                                extensionCompanionSpine.test.ts cross-
#                                package smoke, task #31 / issue #143)
#   extension         blocking  typecheck + vitest unit suite
#   mcp               blocking  typecheck + vitest unit suite
#   vector-real-dim   blocking  real 384-dim sqlite-vec suites (task #31)
#   package-smoke     advisory  wxt build + companion dist boot/shutdown
#                                (task #31; promote once proven stable)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Companion (@sidetrack/companion)
  # test runner: bun test (NOT vitest — see companion package.json)
  # ---------------------------------------------------------------------------
  companion:
    name: Companion — typecheck + test
    runs-on: ubuntu-latest
    # Ubuntu ships a vec-capable /usr/lib/.../libsqlite3.so on the sqlite-vec
    # probe path (setup-sqlite.ts). That enforces strict vec column
    # dimensions and, order-dependently, rejects the low-dimension fixtures
    # some recall/connections tests feed — a moving test flake, not a
    # product issue. Opt out so CI matches the local dev default (no
    # system libsqlite3 → Bun built-in SQLite). Followup: a vec integration
    # lane with dimension-matched (384) fixtures.
    env:
      SIDETRACK_SQLITE_LIB: "off"
    steps:
      - uses: actions/checkout@v4

      - name: No stray compiled artifacts in src (shadow-artifact tripwire)
        run: |
          # A stray compiled artifact shadows a same-basename .ts sibling; hand-written
          # ambient .d.ts files (no sibling source) are legitimate and pass.
          STRAYS=""
          for f in $(git ls-files -o --exclude-standard 'packages/*/src/**/*.js' 'packages/*/src/**/*.d.ts' 'packages/*/src/*.js' 'packages/*/src/*.d.ts'; git ls-files 'packages/*/src/**/*.js' 'packages/*/src/**/*.d.ts' 'packages/*/src/*.js' 'packages/*/src/*.d.ts'); do
            base="${f%.d.ts}"; base="${base%.js}"
            if [ -f "${base}.ts" ] && [ "${base}.ts" != "$f" ]; then STRAYS="$STRAYS $f"; fi
          done
          if [ -n "$STRAYS" ]; then echo "Stray compiled artifacts shadow .ts sources under bun test:"; echo "$STRAYS" | tr ' ' '\n'; exit 1; fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # tsconfig.build.json is the repo's declared typecheck gate (matches the
      # local convention) and MUST stay clean. The full tsconfig.json also
      # typechecks test files, which carry a known ~45-error pre-existing type
      # backlog (`tsc --noEmit -p tsconfig.json` reports 45 as of 2026-07-12);
      # that backlog is deliberately NOT gated here — do not read a green
      # build-gate as "tsconfig.json is clean". This emits dist/ (not --noEmit)
      # because the HNSW reconcile child integration suite spawns a child from
      # dist/sync/contract/connectionsReconcileChild.entry.js.
      - name: Typecheck + build dist (child-process tests need it)
        working-directory: packages/sidetrack-companion
        run: ../../node_modules/.bin/tsc -p tsconfig.build.json

      # Recommendation serving changes have a named referee. Keep this
      # separate from the broad suite so a future test-filtering or teardown
      # workaround cannot accidentally omit the frozen quality cases.
      - name: Golden resolve referee (blocking)
        working-directory: packages/sidetrack-companion
        run: bun run test:golden
        env:
          TMPDIR: /dev/shm

      # bun 1.3.14 reproducibly panics during post-suite teardown on this
      # suite (exit 133) AFTER printing the complete summary — the exit code
      # is unreliable as a pass signal. Parse the summary strictly instead:
      # green requires an explicit " 0 fail" line; anything else (failures,
      # missing summary, truncated output) stays red.
      # TODO: drop this wrapper once a bun upgrade exits cleanly here.
      - name: Test (bun test — summary-parsed, see bun exit-panic note)
        working-directory: packages/sidetrack-companion
        # TMPDIR on tmpfs, TEST STEPS ONLY (job-wide broke bun install:
        # hnswlib-node's prebuild path fails under /dev/shm and falls back to a
        # node-gyp source build). Test vaults live in mkdtemp(tmpdir()), and the
        # double-buffer store seeds every publish by copyFileSync-cloning the
        # generation db — ~0ms COW on local APFS but a FULL byte copy on the
        # runner's ext4 (~10s per 5000-row chunk measured), which stretches
        # timing windows until order-sensitive tests flake. tmpfs restores the
        # "clone is cheap" assumption the store was built on.
        env:
          TMPDIR: /dev/shm
        run: |
          set -o pipefail
          bun test 2>&1 | tee bun-test.log || true
          grep -Eq '^ *[1-9][0-9]* pass$' bun-test.log
          grep -Eq '^ *0 fail$' bun-test.log

  # ---------------------------------------------------------------------------
  # Extension (@sidetrack/extension)
  # Unit tests only — vitest.config.ts includes only tests/unit/**/*.test.{ts,tsx}
  # and src/**/*.test.{ts,tsx}; e2e specs live in tests/e2e/ and are excluded.
  # The unit-test step is BLOCKING (no continue-on-error): the F16 triage wave
  # (2026-07-11) cleared the old 13-fail baseline, so red extension tests fail CI.
  # ---------------------------------------------------------------------------
  extension:
    name: Extension — typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # wxt prepare generates .wxt/tsconfig.json which the extension tsconfig extends.
      - name: Prepare WXT (generates .wxt/ types)
        working-directory: packages/sidetrack-extension
        run: ../../node_modules/.bin/wxt prepare

      - name: Typecheck
        working-directory: packages/sidetrack-extension
        run: ../../node_modules/.bin/tsc --noEmit -p tsconfig.json

      # F16 triage complete (2026-07-11): the 13-fail baseline was cleared
      # (all stale tests — suite is 994/994 green), so this step is BLOCKING.
      - name: Unit tests (vitest — excludes e2e/)
        working-directory: packages/sidetrack-extension
        run: ../../node_modules/.bin/vitest run

  # ---------------------------------------------------------------------------
  # MCP (@sidetrack/mcp)
  # ---------------------------------------------------------------------------
  mcp:
    name: MCP — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/sidetrack-mcp
        run: ../../node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Test (vitest)
        working-directory: packages/sidetrack-mcp
        run: ../../node_modules/.bin/vitest run

  # ---------------------------------------------------------------------------
  # Companion vector store — REAL 384-dim sqlite-vec lane (task #31)
  #
  # The `companion` job above runs with SIDETRACK_SQLITE_LIB=off (Bun's
  # built-in SQLite — no vec0 extension) so low-dimension fixtures elsewhere
  # in that suite don't hit strict vec-column dimension enforcement (see
  # that job's env comment). That means nothing in the blocking gate ever
  # exercises sqlite-vec at the real embedding dimension (384 —
  # recall/embedder.ts, RECALL_MODEL.embeddingDim) end to end — a real
  # column-width mismatch between the manifest and the schema would pass
  # the whole blocking gate silently. This job closes that gap: same
  # ubuntu-latest image, WITHOUT the opt-out (ubuntu ships
  # /usr/lib/x86_64-linux-gnu/libsqlite3.so — the exact fact that made the
  # opt-out necessary above), scoped to the suites that are genuinely
  # vector-dependent (touch docs_vec directly, or assert
  # store.vectorBackendAvailable) — not the whole companion suite, which
  # still carries low-dimension fixtures this lane isn't meant to fix.
  #
  # Local measurement (2026-08-17, real vec-capable
  # /opt/homebrew/opt/sqlite/lib/libsqlite3.dylib, 3 repeated runs): 20
  # tests / 5 files, 371-406ms total. Comfortably under this repo's
  # 2-minute blocking bar — BLOCKING.
  #
  # Scope note: a wider combination (adding the HNSW-reconcile / Class-B
  # connections child-process integration suites) was tried locally and hit
  # an unrelated cross-file flake — a shared recall-v2 store singleton
  # intermittently reporting vectorBackendAvailable=false only when those
  # heavier suites ran first in the same process. That is not a real-
  # dimension correctness issue, and chasing it would mean changing
  # connectionsMaterializer.ts internals (out of scope here). Left as a
  # followup; this job's scope is deliberately the reliable subset.
  vector-real-dim:
    name: Companion — real 384-dim sqlite-vec lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # No SIDETRACK_SQLITE_LIB override — setup-sqlite.ts's own candidate
      # probe finds ubuntu's system libsqlite3 and loads sqlite-vec for
      # real. The grep below fails loudly if it didn't: a silently
      # degraded run here would pass vacuously and defeat the point of the
      # job (see setup-sqlite.ts's candidate path list if this ever fires —
      # it means ubuntu-latest stopped shipping libsqlite3.so at the
      # expected multiarch path, and this job needs to move to
      # runs-on: macos-latest instead, at the cost of a slower/pricier
      # runner).
      - name: Test — vector-dependent suites, real dimensions
        working-directory: packages/sidetrack-companion
        run: |
          set -o pipefail
          bun test \
            src/recall-v2/store/canonical-vectors.test.ts \
            src/recall-v2/store/host-purge.test.ts \
            src/recall-v2/store/backfill-delta.test.ts \
            src/recall-v2/store/vectorProjectionState.test.ts \
            src/http/prototypeLaneWiring.test.ts \
            2>&1 | tee vector-test.log
          grep -q 'sqlite-vec loaded via bun-sqlite' vector-test.log || {
            echo "sqlite-vec never loaded on this runner — the real-dim lane ran vacuously. See setup-sqlite.ts; this job may need runs-on: macos-latest.";
            exit 1;
          }
          grep -Eq '^ *[1-9][0-9]* pass$' vector-test.log
          grep -Eq '^ *0 fail$' vector-test.log

  # ---------------------------------------------------------------------------
  # Package smoke — real build artifacts, real process lifecycle (task #31)
  #
  # ADVISORY (continue-on-error): unlike the unit-test jobs above, this job
  # exercises `wxt build` (real esbuild/rollup bundling, ~106MB of output
  # including onnxruntime-web WASM) and a real `bun dist/cli.js` child
  # process with signal handling — more exposed to environment-specific
  # flake (bundler version drift, runner resource limits under process
  # spawn) than a pure `bun test` unit run. Advisory first; promote to
  # blocking once it has proven stable across real PR traffic — see
  # docs/CI.md.
  #
  # What it proves that unit tests can't: that `wxt build` + `tsc -p
  # tsconfig.build.json` + `stamp-build.mjs` actually produce a runnable
  # dist/cli.js (not just typecheck-clean source), that /v1/version reports
  # a real buildSha end to end (the #264 menu-bar-app stale-dist fix), and
  # that the #374 shutdown-watchdog contract (SIGTERM -> closeAll() within
  # SIDETRACK_SHUTDOWN_GRACE_MS, default 15s) holds for a real process, not
  # a mocked one.
  package-smoke:
    name: Package smoke — build + boot + shutdown (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build extension artifact (wxt build)
        working-directory: packages/sidetrack-extension
        run: ../../node_modules/.bin/wxt build

      - name: Build companion dist (tsc + stamp)
        working-directory: packages/sidetrack-companion
        run: |
          ../../node_modules/.bin/tsc -p tsconfig.build.json
          bun scripts/stamp-build.mjs

      - name: Boot against an empty vault; check /v1/version buildSha; verify SIGTERM shutdown within grace
        working-directory: packages/sidetrack-companion
        run: |
          set -euo pipefail
          PORT=18271
          VAULT="$(mktemp -d)"
          LOG="$(mktemp)"

          bun --smol dist/cli.js --vault "$VAULT" --port "$PORT" > "$LOG" 2>&1 &
          PID=$!

          READY=0
          for _ in $(seq 1 60); do
            if curl -s -f "http://127.0.0.1:${PORT}/v1/version" > /tmp/version-response.json; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            echo "companion never answered /v1/version"; cat "$LOG"; kill -9 "$PID" 2>/dev/null || true; exit 1
          fi
          cat /tmp/version-response.json

          BUILD_SHA=$(bun -e 'const b = require("/tmp/version-response.json"); console.log(b.data.buildSha ?? "");')
          if [ -z "$BUILD_SHA" ] || [ "$BUILD_SHA" = "null" ]; then
            echo "buildSha missing from /v1/version response"; kill -9 "$PID" 2>/dev/null || true; exit 1
          fi
          echo "buildSha=$BUILD_SHA"

          kill -TERM "$PID"
          GRACE_CEILING_S=20
          EXITED=0
          for _ in $(seq 1 $((GRACE_CEILING_S * 5))); do
            if ! kill -0 "$PID" 2>/dev/null; then EXITED=1; break; fi
            sleep 0.2
          done
          if [ "$EXITED" -ne 1 ]; then
            echo "companion did not exit within ${GRACE_CEILING_S}s of SIGTERM (SIDETRACK_SHUTDOWN_GRACE_MS default 15000)"
            kill -9 "$PID" 2>/dev/null || true; cat "$LOG"; exit 1
          fi
          echo "shutdown OK"
          rm -rf "$VAULT" "$LOG" /tmp/version-response.json
